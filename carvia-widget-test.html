    <title>Carvia Score Widget Test</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          Oxygen, Ubuntu, Cantarell, sans-serif;

  <body>
    <!-- Google Tag Manager (noscript) -->
    <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-PD54972R"
    height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
    <!-- End Google Tag Manager (noscript) -->
    <h1>Test Carvia Score Widget</h1>

    <div class="info">
      <strong>Local Testing Setup:</strong><br />
      • Widgets-host must be running on <code>http://localhost:4000</code><br />
      • Main app must be running on <code>http://localhost:3000</code><br />
      • Domain <code>localhost</code> must be verified for your client<br />
      • Publishable Key:
      <code>carvia_pub_da6aaf899f1c7157cf49224beba9bb85</code>
    </div>

    <div id="carvia-widget"></div>

    <!-- Use localhost SDK for local testing -->
    <script>
      // Inline SDK with localhost origin for local testing
      (function () {
        const W = (window.CarviaWidgets = window.CarviaWidgets || {});
        const instances = new Map();
        const ORIGIN = "http://localhost:4000"; // Local testing origin

        function createIframe(mountEl, url) {
          const f = document.createElement("iframe");
          f.src = url;
          f.loading = "lazy";
          f.title = "Carvia Widget";
          f.style.width = "100%";
          f.style.border = "0";
          f.style.display = "block";
          f.setAttribute(
            "sandbox",
            "allow-scripts allow-forms allow-same-origin"
          );
          mountEl.appendChild(f);
          return f;
        }

        async function exchangePK(publishableKey, widget) {
          // For file:// protocol, use localhost as fallback origin
          const origin = window.location.origin || "http://localhost";
          const res = await fetch(`${ORIGIN}/api/sessions-pk`, {
            method: "POST",
            headers: {
              "content-type": "application/json",
              Origin: origin, // Send current origin (or localhost fallback for file://)
            },
            body: JSON.stringify({ publishableKey, widget }),
          });
          if (!res.ok) {
            const errorText = await res.text();
            throw new Error(
              `session_exchange_failed: ${res.status} ${errorText}`
            );
          }
          return res.json();
        }

        function mount(selectorOrEl, opts) {
          const el =
            typeof selectorOrEl === "string"
              ? document.querySelector(selectorOrEl)
              : selectorOrEl;
          if (!el) throw new Error("mount_element_not_found");
          const { widget, publishableKey, inputs, onReady, onError } =
            opts || {};
          if (!widget || !publishableKey)
            throw new Error("missing_widget_or_key");

          const io = new IntersectionObserver(
            async (entries) => {
              if (!entries.some((e) => e.isIntersecting)) return;
              io.disconnect();
              try {
                console.log(
                  "[SDK] Exchanging publishable key for session token..."
                );
                const { iframeUrl } = await exchangePK(publishableKey, widget);
                console.log("[SDK] Got iframe URL:", iframeUrl);
                const fullUrl = `${ORIGIN}${iframeUrl}`;
                console.log("[SDK] Full iframe URL:", fullUrl);
                const f = createIframe(el, fullUrl);

                function onMessage(e) {
                  if (e.source !== f.contentWindow) return;
                  if (!e.data || e.data.__carvia !== true) return;
                  console.log("[SDK] Received message:", e.data.type);
                  if (e.data.type === "ready") {
                    console.log("[SDK] Widget ready, sending props:", inputs);
                    onReady && onReady();
                    f.contentWindow.postMessage(
                      {
                        __carvia: true,
                        type: "setProps",
                        payload: inputs || {},
                      },
                      "*"
                    );
                  } else if (e.data.type === "resize") {
                    f.style.height = (e.data.h || 0) + "px";
                  } else if (e.data.type === "error") {
                    console.error("[SDK] Widget error:", e.data.error);
                    onError && onError(e.data.error);
                  }
                }
                window.addEventListener("message", onMessage);
                instances.set(el, { f, onMessage });
              } catch (e) {
                console.error("[SDK] Mount error:", e);
                onError && onError(e);
              }
            },
            { rootMargin: "200px" }
          );

          io.observe(el);
        }

        function setProps(selectorOrEl, payload) {
          const el =
            typeof selectorOrEl === "string"
              ? document.querySelector(selectorOrEl)
              : selectorOrEl;
          const inst = [...instances.entries()].find(([k]) => k === el)?.[1];
          if (!inst) return;
          inst.f.contentWindow.postMessage(
            { __carvia: true, type: "setProps", payload },
            "*"
          );
        }

        function destroy(selectorOrEl) {
          const el =
            typeof selectorOrEl === "string"
              ? document.querySelector(selectorOrEl)
              : selectorOrEl;
          const inst = [...instances.entries()].find(([k]) => k === el)?.[1];
          if (!inst) return;
          window.removeEventListener("message", inst.onMessage);
          inst.f.remove();
          instances.delete(el);
        }

        W.mount = mount;
        W.setProps = setProps;
        W.destroy = destroy;
      })();
    </script>

    <script>
      // Mount the widget
      console.log("[Test] Mounting Carvia Score Widget...");
      CarviaWidgets.mount("#carvia-widget", {
        widget: "carvia-score-widget",
        publishableKey: "carvia_pub_da6aaf899f1c7157cf49224beba9bb85",
        inputs: {
          vin: "1HGCT1B86EA014310",
          mileage: 50000,
          listingPrice: 25000,
        },
        onReady: () => {
          console.log("[Test] Widget ready!");
        },
        onError: (err) => {
          console.error("[Test] Widget error:", err);
          document.getElementById("carvia-widget").innerHTML = `
            <div style="padding: 20px; color: #d32f2f;">
              <h3>Error Loading Widget</h3>
              <p>${err.message || err}</p>
              <p style="font-size: 0.9em; margin-top: 10px; color: #666;">
                Check the browser console for more details.
              </p>
            </div>
          `;
        },
      });
    </script>
